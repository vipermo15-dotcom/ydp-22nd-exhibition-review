<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제22회 영등포미술협회 정기전 — 확인 자료</title>
<style>
  :root{
    --navy-ink:#1c2b4a; --navy:#2e4468; --slate:#5a7291;
    --gold:#b28e4e; --gold-dp:#8f6f34; --ivory:#fbf8f1;
    --bg:#ece7db; --panel:#fbf8f1; --text:#22304d; --text-soft:#5a6377; --line:#ded5c2;
    --serif:'Nanum Myeongjo','Apple Myungjo',Georgia,serif;
    --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:60px 24px;text-align:center;}
  .hero{padding:36px 24px;border-radius:14px;background:linear-gradient(180deg,#faf7ef,#f2ecdf);border:1px solid var(--line);}
  .kick{font-family:var(--serif);letter-spacing:.34em;text-transform:uppercase;color:var(--gold-dp);font-size:.78rem;font-weight:700;}
  h1{font-family:var(--serif);color:var(--navy-ink);font-size:1.5rem;margin:12px 0 6px;}
  p{color:var(--slate);font-family:var(--serif);font-style:italic;}
  .links{display:flex;flex-direction:column;gap:14px;margin-top:28px;}
  a.btn{display:block;background:var(--navy);color:var(--ivory);text-decoration:none;padding:16px 20px;
    border-radius:10px;font-weight:700;font-size:1rem;font-family:var(--sans);}
  a.btn small{display:block;font-weight:400;font-size:.8rem;opacity:.8;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="kick">22nd Exhibition</div>
    <h1>제22회 영등포미술협회 정기전</h1>
    <p>홍보물 제작 확인 자료</p>
  </div>
  <div class="links">
    <a class="btn" href="plan.html">📋 기획안<small>전시 개요 · 6종 산출물 · 제작 일정</small></a>
    <a class="btn" href="artists.html">🖋️ 참여작가 시트<small>확인 44명 · 미확인 11명</small></a>
    <a class="btn" href="confirm.html">① 회장님 확인 요청<small>대표 이미지 후보 8점 &amp; 작가 미확인 11점</small></a>
    <a class="btn" href="contact-sheet.html">② 전체 사진 콘택트시트<small>수령한 원본사진 58점 전체 보기</small></a>
  </div>
</div>
</body>
</html>
